spring.application.name=HealthEase

# Server Configuration
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/healthease
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=your-secret-key-change-in-production-minimum-32-characters
jwt.expiration=604800000

# Logging Configuration
logging.level.com.healthease=INFO
logging.level.org.springframework.security=DEBUG

# Static Resources
spring.web.resources.static-locations=classpath:/static/,file:public/
