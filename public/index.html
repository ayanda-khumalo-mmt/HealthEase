<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthEase - Connect with Doctors</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav id="navbar" style="display: none;">
            <div class="nav-container">
                <div class="nav-brand">HealthEase</div>
                <div class="nav-links">
                    <span id="nav-user-name"></span>
                    <button onclick="logout()" class="btn btn-secondary">Logout</button>
                </div>
            </div>
        </nav>

        <!-- Auth Section (Login/Register) -->
        <div id="auth-section">
            <div class="auth-container">
                <div class="auth-header">
                    <h1>HealthEase</h1>
                    <p>Connect with doctors and manage your health records</p>
                </div>

                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="showLoginForm()">Login</button>
                    <button class="tab-btn" onclick="showRegisterForm()">Register</button>
                </div>

                <!-- Login Form -->
                <div id="login-form" class="auth-form">
                    <h2>Login</h2>
                    <form onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="login-email" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="login-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>

                <!-- Register Form -->
                <div id="register-form" class="auth-form" style="display: none;">
                    <h2>Register</h2>
                    <form onsubmit="handleRegister(event)">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="register-name" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="register-email" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="register-password" required>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="register-phone">
                        </div>
                        <div class="form-group">
                            <label>Date of Birth</label>
                            <input type="date" id="register-dob">
                        </div>
                        <div class="form-group">
                            <label>Address</label>
                            <textarea id="register-address"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Register As</label>
                            <select id="register-role" onchange="handleRoleChange()">
                                <option value="patient">Patient</option>
                                <option value="doctor">Doctor</option>
                            </select>
                        </div>
                        <div id="doctor-fields" style="display: none;">
                            <div class="form-group">
                                <label>Specialization</label>
                                <input type="text" id="register-specialization">
                            </div>
                            <div class="form-group">
                                <label>License Number</label>
                                <input type="text" id="register-license">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Register</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" style="display: none;">
            <!-- Patient Dashboard -->
            <div id="patient-dashboard" style="display: none;">
                <div class="dashboard-container">
                    <h1>Patient Dashboard</h1>
                    
                    <div class="dashboard-tabs">
                        <button class="tab-btn active" onclick="showPatientSection('medical-history')">Medical History</button>
                        <button class="tab-btn" onclick="showPatientSection('appointments')">My Appointments</button>
                        <button class="tab-btn" onclick="showPatientSection('schedule')">Schedule Appointment</button>
                    </div>

                    <!-- Medical History Section -->
                    <div id="medical-history-section" class="dashboard-content">
                        <h2>Medical History</h2>
                        <div id="medical-records-list"></div>
                    </div>

                    <!-- Appointments Section -->
                    <div id="appointments-section" class="dashboard-content" style="display: none;">
                        <h2>My Appointments</h2>
                        <div id="patient-appointments-list"></div>
                    </div>

                    <!-- Schedule Appointment Section -->
                    <div id="schedule-section" class="dashboard-content" style="display: none;">
                        <h2>Schedule Appointment</h2>
                        <form onsubmit="handleScheduleAppointment(event)" class="appointment-form">
                            <div class="form-group">
                                <label>Select Doctor</label>
                                <select id="appointment-doctor" required></select>
                            </div>
                            <div class="form-group">
                                <label>Date</label>
                                <input type="date" id="appointment-date" required>
                            </div>
                            <div class="form-group">
                                <label>Time</label>
                                <input type="time" id="appointment-time" required>
                            </div>
                            <div class="form-group">
                                <label>Reason for Visit</label>
                                <textarea id="appointment-reason" required></textarea>
                            </div>
                            <div class="form-group">
                                <label>Additional Notes</label>
                                <textarea id="appointment-notes"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Schedule Appointment</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Doctor Dashboard -->
            <div id="doctor-dashboard" style="display: none;">
                <div class="dashboard-container">
                    <h1>Doctor Dashboard</h1>
                    
                    <div class="dashboard-tabs">
                        <button class="tab-btn active" onclick="showDoctorSection('appointments')">Appointments</button>
                        <button class="tab-btn" onclick="showDoctorSection('patients')">My Patients</button>
                        <button class="tab-btn" onclick="showDoctorSection('add-record')">Add Medical Record</button>
                    </div>

                    <!-- Appointments Section -->
                    <div id="doctor-appointments-section" class="dashboard-content">
                        <h2>Appointments</h2>
                        <div id="doctor-appointments-list"></div>
                    </div>

                    <!-- Patients Section -->
                    <div id="patients-section" class="dashboard-content" style="display: none;">
                        <h2>My Patients</h2>
                        <div id="patients-list"></div>
                    </div>

                    <!-- Add Medical Record Section -->
                    <div id="add-record-section" class="dashboard-content" style="display: none;">
                        <h2>Add Medical Record</h2>
                        <form onsubmit="handleAddMedicalRecord(event)" class="medical-record-form">
                            <div class="form-group">
                                <label>Patient</label>
                                <select id="record-patient" required></select>
                            </div>
                            <div class="form-group">
                                <label>Visit Date</label>
                                <input type="date" id="record-date" required>
                            </div>
                            <div class="form-group">
                                <label>Diagnosis</label>
                                <textarea id="record-diagnosis" required></textarea>
                            </div>
                            <div class="form-group">
                                <label>Prescription</label>
                                <textarea id="record-prescription"></textarea>
                            </div>
                            <div class="form-group">
                                <label>Notes</label>
                                <textarea id="record-notes"></textarea>
                            </div>
                            <div class="form-group">
                                <label>Follow-up Date</label>
                                <input type="date" id="record-followup">
                            </div>
                            <button type="submit" class="btn btn-primary">Add Medical Record</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Admin Dashboard -->
            <div id="admin-dashboard" style="display: none;">
                <div class="dashboard-container">
                    <h1>Admin Dashboard</h1>
                    
                    <div class="dashboard-tabs">
                        <button class="tab-btn active" onclick="showAdminSection('users')">All Users</button>
                    </div>

                    <!-- Users Section -->
                    <div id="users-section" class="dashboard-content">
                        <h2>All Users</h2>
                        <div id="users-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
